<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ireen Kathure</title>
</head>
<body>
    <header>
        <h1>Contact Me</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get In Touch</h2>
            <form action="#" method="post">
                <div>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Ireen Kathure" required>
                </div>
                <br>
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="ireen@example.com" required>
                </div>
                <br>
                <div>
                    <label for="reason">Reason for Contact</label>
                    <select id="reason" name="reason" required>
                        <option value="">--Please choose an option--</option>
                        <option value="collaboration">Collaboration</option>
                        <option value="job">Job Opportunity</option>
                        <option value="feedback">Feedback</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="message">Your Message (at least 50 characters)</label>
                    <textarea id="message" name="message" minlength="50" rows="5" placeholder="Write your message here..." required></textarea>
                </div>
                <br>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ireen Kathure. <a href="index.html">Back to Home</a></p>
    </footer>
</body>
</html>
